name: Web Quality Gates (LEGACY - disabled)

# Legacy web/ frontend. All new frontend work is in web2/.
# This workflow is disabled. Remove when web/ directory is deleted.
on:
  workflow_dispatch: {}

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm ci
      working-directory: ./web

    - name: Build
      run: npm run build
      working-directory: ./web

    - name: Test
      run: npm test
      working-directory: ./web
